# helios-lab sshd drop-in, pushed by helios-lab up; helios-lab-host install
# places it as /etc/ssh/sshd_config.d/10-helios-lab.conf and reloads sshd.
# The idle check counts established sessions on the host's :22, so a client
# that vanished (a sleeping Mac, a dropped network) must stop counting: sshd
# probes a silent client every 60 s and drops it after 3 probes go
# unanswered, within about 3 minutes. Without this, a dead connection would
# count as activity until TCP keepalive gave up, after more than 2 hours.
# sshd keeps the first value it reads for a keyword and reads its drop-ins,
# in name order, before the rest of sshd_config: hence the "10-" name.
ClientAliveInterval 60
ClientAliveCountMax 3
