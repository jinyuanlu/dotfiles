# ~/.tmux.conf
# Reload after edits:  tmux source-file ~/.tmux.conf

# ── splits ────────────────────────────────────────────────
# Mnemonic: `|` is a vertical bar, `-` is a horizontal bar.
# New panes inherit the current pane's cwd.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── help popup ────────────────────────────────────────────
# prefix + h  →  cheatsheet (press q to close)
bind h display-popup -w 60% -h 60% -E "less ~/.tmux-help.txt"

# ── quality of life ───────────────────────────────────────
set -g mouse on                # click panes / scroll / right-click menu
set -g base-index 1            # windows start at 1, not 0
setw -g pane-base-index 1      # panes start at 1, not 0
set -g history-limit 50000     # bigger scrollback
set -sg escape-time 10         # snappier prefix response
